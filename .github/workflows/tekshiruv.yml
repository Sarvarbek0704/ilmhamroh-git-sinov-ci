name: Tekshiruv

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v7
      - name: Node.js o'rnatish
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Paketlarni o'rnatish
        run: npm ci
      - name: Tekshiruv
        run: npm run check
